name: V.h remediation typecheck diagnostic

on:
  push:
    branches:
      - wip/vh-world-visual-foundation
    paths:
      - .github/workflows/vh-typecheck-diagnostic.yml
      - scripts/vh-typecheck-diagnostic-trigger.txt

permissions:
  contents: write

jobs:
  diagnose-typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/vh-world-visual-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remediation and capture typecheck output
        shell: bash
        run: |
          set +e
          node scripts/vh-visual-remediation-runner.mjs > /tmp/remediation.log 2>&1
          remediation_status=$?
          if [ "$remediation_status" -eq 0 ]; then
            pnpm --filter @landlord/web typecheck > /tmp/typecheck.log 2>&1
            typecheck_status=$?
          else
            printf 'remediation failed before typecheck\n' > /tmp/typecheck.log
            typecheck_status=$remediation_status
          fi
          mkdir -p docs/execution/phase-4
          {
            printf '%s\n' '# V.h remediation diagnostic'
            printf '%s\n\n' '## Remediation'
            cat /tmp/remediation.log
            printf '\nremediation_status=%s\n\n' "$remediation_status"
            printf '%s\n\n' '## Typecheck'
            cat /tmp/typecheck.log
            printf '\ntypecheck_status=%s\n' "$typecheck_status"
          } > docs/execution/phase-4/vh-typecheck-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/execution/phase-4/vh-typecheck-diagnostic.log
          git commit -m "chore: record V.h typecheck diagnostic" || true
          git push origin HEAD:wip/vh-world-visual-foundation
          exit "$typecheck_status"
