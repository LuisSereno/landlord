name: V.h visual remediation v2

on:
  push:
    branches:
      - wip/vh-world-visual-foundation
    paths:
      - scripts/vh-visual-remediation-v2.mjs
      - scripts/vh-visual-remediation-v2-trigger.txt
      - .github/workflows/vh-visual-remediation-v2.yml

permissions:
  contents: write

concurrency:
  group: vh-visual-remediation-v2
  cancel-in-progress: false

jobs:
  remediate-verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout current branch
        uses: actions/checkout@v4
        with:
          ref: wip/vh-world-visual-foundation
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install workspace
        run: pnpm install --frozen-lockfile

      - name: Apply HEAD-aligned remediation
        run: node scripts/vh-visual-remediation-v2.mjs

      - name: Format changed text files
        run: |
          pnpm exec prettier --write \
            apps/web/src/assets/runtime-assets.ts \
            apps/web/src/generated/runtime-visual-overrides.json \
            apps/web/src/isometric/gameplay-visual-adapter.ts \
            apps/web/src/isometric/IsometricSpikeScene.ts \
            apps/web/src/isometric/visual-scale.ts \
            apps/web/src/isometric/visual-remediation.test.ts \
            blender_artist/manifests/runtime-promotions.json \
            scripts/vh-world-visual-capture.mjs

      - name: Typecheck
        run: pnpm --filter @landlord/web typecheck

      - name: Lint web
        run: pnpm --filter @landlord/web lint

      - name: Test web
        run: pnpm --filter @landlord/web test

      - name: Full-world and performance gates
        env:
          VC9_FULLWORLD: "1"
          VH10_PERF: "1"
        run: pnpm --filter @landlord/web test

      - name: Build web
        run: pnpm --filter @landlord/web build

      - name: Install pixel-QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pnpm exec playwright install --with-deps chromium

      - name: Regenerate real Phaser pixel QA
        run: node scripts/vh-world-visual-capture.mjs

      - name: Remove superseded failed remediation harness
        run: |
          rm -f .github/workflows/vh-visual-remediation.yml
          rm -f scripts/vh-visual-remediation.mjs
          rm -f scripts/vh-visual-remediation-contract-fix.mjs
          rm -f scripts/vh-visual-remediation-trigger.txt

      - name: Commit verified remediation and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: remediate V.h visual scale, orientation and catalog"
          git push origin HEAD:wip/vh-world-visual-foundation
