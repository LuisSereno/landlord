name: V.h remediation test diagnostic

on:
  push:
    branches:
      - wip/vh-world-visual-foundation
    paths:
      - scripts/vh-test-diagnostic-trigger.txt
      - .github/workflows/vh-test-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/vh-world-visual-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remediation and capture Vitest output
        shell: bash
        run: |
          set +e
          node scripts/vh-visual-remediation-runner.mjs > /tmp/remediation.log 2>&1
          node scripts/vh-visual-remediation-typefix.mjs >> /tmp/remediation.log 2>&1
          node scripts/vh-visual-remediation-testfix.mjs >> /tmp/remediation.log 2>&1
          node scripts/vh-visual-remediation-lintfix.mjs >> /tmp/remediation.log 2>&1
          remediation_status=$?
          if [ "$remediation_status" -eq 0 ]; then
            pnpm --filter @landlord/web test > /tmp/tests.log 2>&1
            test_status=$?
          else
            printf 'remediation failed before tests\n' > /tmp/tests.log
            test_status=$remediation_status
          fi
          mkdir -p docs/execution/phase-4
          {
            printf '%s\n' '# V.h test diagnostic'
            printf '%s\n\n' '## Remediation'
            cat /tmp/remediation.log
            printf '\nremediation_status=%s\n\n' "$remediation_status"
            printf '%s\n\n' '## Vitest'
            cat /tmp/tests.log
            printf '\ntest_status=%s\n' "$test_status"
          } > docs/execution/phase-4/vh-test-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/execution/phase-4/vh-test-diagnostic.log
          git commit -m "chore: record exact V.h test diagnostic" || true
          git pull --rebase origin wip/vh-world-visual-foundation
          git push origin HEAD:wip/vh-world-visual-foundation
          exit "$test_status"
