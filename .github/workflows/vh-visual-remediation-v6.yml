name: V.h visual remediation v6

on:
  push:
    branches:
      - wip/vh-world-visual-foundation
    paths:
      - scripts/vh-visual-remediation-v6-trigger.txt
      - .github/workflows/vh-visual-remediation-v6.yml

permissions:
  contents: write

concurrency:
  group: vh-visual-remediation-v6
  cancel-in-progress: false

jobs:
  remediate-verify-and-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/vh-world-visual-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply audited visual remediation
        run: |
          node scripts/vh-visual-remediation-runner.mjs
          node scripts/vh-visual-remediation-typefix.mjs
          node scripts/vh-visual-remediation-testfix.mjs
          node scripts/vh-visual-remediation-lintfix.mjs
          node scripts/vh-visual-remediation-testfix2.mjs

      - name: Format changed text files
        run: |
          pnpm exec prettier --write \
            apps/web/src/assets/runtime-assets.ts \
            apps/web/src/generated/runtime-visual-overrides.json \
            apps/web/src/isometric/gameplay-visual-adapter.ts \
            apps/web/src/isometric/gameplay-visual-adapter.test.ts \
            apps/web/src/isometric/IsometricSpikeScene.ts \
            apps/web/src/isometric/visual-scale.ts \
            apps/web/src/isometric/visual-remediation.test.ts \
            blender_artist/manifests/runtime-promotions.json \
            scripts/vh-world-visual-capture.mjs

      - name: Typecheck
        run: pnpm --filter @landlord/web typecheck
      - name: Lint
        run: pnpm --filter @landlord/web lint
      - name: Web suite
        run: pnpm --filter @landlord/web test
      - name: Full-world and performance gates
        env:
          VC9_FULLWORLD: "1"
          VH10_PERF: "1"
        run: pnpm --filter @landlord/web test
      - name: Production build
        run: pnpm --filter @landlord/web build

      - name: Install pixel-QA dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          pnpm exec playwright install --with-deps chromium
      - name: Regenerate Phaser pixel QA
        run: node scripts/vh-world-visual-capture.mjs

      - name: Remove temporary remediation infrastructure
        run: |
          rm -f .github/workflows/vh-visual-remediation.yml
          rm -f .github/workflows/vh-visual-remediation-v2.yml
          rm -f .github/workflows/vh-visual-remediation-v3.yml
          rm -f .github/workflows/vh-visual-remediation-v4.yml
          rm -f .github/workflows/vh-visual-remediation-v5.yml
          rm -f .github/workflows/vh-visual-remediation-v6.yml
          rm -f .github/workflows/vh-remediation-diagnostic.yml
          rm -f .github/workflows/vh-typecheck-diagnostic.yml
          rm -f .github/workflows/vh-typecheck-diagnostic-v2.yml
          rm -f .github/workflows/vh-lint-diagnostic.yml
          rm -f .github/workflows/vh-lint-diagnostic-v2.yml
          rm -f .github/workflows/vh-test-diagnostic.yml
          rm -f scripts/vh-visual-remediation.mjs
          rm -f scripts/vh-visual-remediation-contract-fix.mjs
          rm -f scripts/vh-visual-remediation-v2.mjs
          rm -f scripts/vh-visual-remediation-runner.mjs
          rm -f scripts/vh-visual-remediation-typefix.mjs
          rm -f scripts/vh-visual-remediation-testfix.mjs
          rm -f scripts/vh-visual-remediation-lintfix.mjs
          rm -f scripts/vh-visual-remediation-testfix2.mjs
          rm -f scripts/vh-visual-remediation-trigger.txt
          rm -f scripts/vh-visual-remediation-v2-trigger.txt
          rm -f scripts/vh-visual-remediation-v3-trigger.txt
          rm -f scripts/vh-visual-remediation-v4-trigger.txt
          rm -f scripts/vh-visual-remediation-v5-trigger.txt
          rm -f scripts/vh-visual-remediation-v6-trigger.txt
          rm -f scripts/vh-remediation-diagnostic-trigger.txt
          rm -f scripts/vh-typecheck-diagnostic-trigger.txt
          rm -f scripts/vh-lint-diagnostic-v2-trigger.txt
          rm -f scripts/vh-test-diagnostic-trigger.txt
          rm -f docs/execution/phase-4/vh-remediation-diagnostic.log
          rm -f docs/execution/phase-4/vh-typecheck-diagnostic.log
          rm -f docs/execution/phase-4/vh-lint-diagnostic.log
          rm -f docs/execution/phase-4/vh-test-diagnostic.log

      - name: Commit verified fixes and evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "fix: remediate V.h visual scale, orientation and catalog"
          git pull --rebase origin wip/vh-world-visual-foundation
          git push origin HEAD:wip/vh-world-visual-foundation
