name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.11.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Gate 2 browser smoke
        run: pnpm smoke:phase2

      - name: Alpha browser smoke
        run: pnpm smoke:alpha

      - name: Art Lab browser smoke
        run: pnpm smoke:art-lab

      # Visual regression runs locally only (pnpm art:visual) — Phaser/SVG canvas rendering
      # differs across environments, making cross-environment pixel comparison non-viable.

      - name: Blender bundle integrity
        run: pnpm art:blender:check

      - name: Binary budget (D-081)
        run: pnpm art:binaries:check

      # Licencias de terceros sobre los bundles publicados. `art:staging:validate` NO va aquí:
      # valida archivos físicos de staging que están fuera de Git por D-054, así que sólo puede
      # correr en la máquina del artista.
      - name: Third-party licence guard (D-083)
        run: pnpm art:licenses:check

      - name: Check formatting
        run: pnpm format:check
