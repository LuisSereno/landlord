name: V.h remediation diagnostic

on:
  push:
    branches:
      - wip/vh-world-visual-foundation
    paths:
      - .github/workflows/vh-remediation-diagnostic.yml
      - scripts/vh-remediation-diagnostic-trigger.txt

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/vh-world-visual-foundation
          fetch-depth: 0
      - name: Run remediation and persist exact failure
        shell: bash
        run: |
          set +e
          node scripts/vh-visual-remediation-v2.mjs > /tmp/vh-remediation.log 2>&1
          status=$?
          cat /tmp/vh-remediation.log
          mkdir -p docs/execution/phase-4
          cp /tmp/vh-remediation.log docs/execution/phase-4/vh-remediation-diagnostic.log
          printf '\nexit_status=%s\n' "$status" >> docs/execution/phase-4/vh-remediation-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/execution/phase-4/vh-remediation-diagnostic.log
          git commit -m "chore: record exact V.h remediation diagnostic" || true
          git push origin HEAD:wip/vh-world-visual-foundation
          exit "$status"
