name: V.h remediation lint diagnostic v2

on:
  push:
    branches:
      - wip/vh-world-visual-foundation
    paths:
      - scripts/vh-lint-diagnostic-v2-trigger.txt
      - .github/workflows/vh-lint-diagnostic-v2.yml

permissions:
  contents: write

jobs:
  diagnose-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: wip/vh-world-visual-foundation
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply remediation and capture lint output
        shell: bash
        run: |
          set +e
          node scripts/vh-visual-remediation-runner.mjs > /tmp/remediation.log 2>&1
          node scripts/vh-visual-remediation-typefix.mjs >> /tmp/remediation.log 2>&1
          node scripts/vh-visual-remediation-testfix.mjs >> /tmp/remediation.log 2>&1
          remediation_status=$?
          if [ "$remediation_status" -eq 0 ]; then
            pnpm --filter @landlord/web lint > /tmp/lint.log 2>&1
            lint_status=$?
          else
            printf 'remediation failed before lint\n' > /tmp/lint.log
            lint_status=$remediation_status
          fi
          mkdir -p docs/execution/phase-4
          {
            printf '%s\n' '# V.h lint diagnostic v2'
            printf '%s\n\n' '## Remediation'
            cat /tmp/remediation.log
            printf '\nremediation_status=%s\n\n' "$remediation_status"
            printf '%s\n\n' '## Lint'
            cat /tmp/lint.log
            printf '\nlint_status=%s\n' "$lint_status"
          } > docs/execution/phase-4/vh-lint-diagnostic.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/execution/phase-4/vh-lint-diagnostic.log
          git commit -m "chore: record exact V.h lint diagnostic v2" || true
          git pull --rebase origin wip/vh-world-visual-foundation
          git push origin HEAD:wip/vh-world-visual-foundation
          exit "$lint_status"
